name: Build and Push Docker Image

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        run: |
          docker build \
            --no-cache \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_AUTH_APP_ID=${{ vars.NEXT_PUBLIC_AUTH_APP_ID }} \
            --build-arg NEXT_PUBLIC_DISABLE_CSRF=${{ vars.NEXT_PUBLIC_DISABLE_CSRF }} \
            -t ghcr.io/${{ github.repository }}:staging .
          docker push ghcr.io/${{ github.repository }}:staging

      - name: Trigger Dokploy Deploy
        if: github.ref == 'refs/heads/staging' # Sesuaikan jika pakai main
        run: |
          # Webhook URL ini bisa didapatkan di Dokploy -> Deployments -> Copy Webhook
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
